<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>7-bog'lama sotuv</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F7;--card:#fff;--line:#E7ECF3;--track:#EEF1F6;--text:#0F172A;--muted:#64748B;--dim:#94A0B4;--soft:#334155;
  --green:#10B981;--green2:#059669;--teal:#0F766E;--greenbg:#ECFDF5;--orange:#D97706;--orange2:#F59E0B;--orangebg:#FFF7E6;
  --red:#E5484D;--redbg:#FEF0F0;--blue:#3B82F6;--bluebg:#EFF6FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 104px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.06)}
.ttl{font-weight:800;font-size:17px;letter-spacing:-.01em}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.num{font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}.xs{font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{padding:14px}
.track{height:10px;background:var(--track);border-radius:999px;overflow:hidden;display:flex}
.fill{height:100%;width:0;border-radius:999px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--soft);white-space:nowrap;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;font-size:15px;outline:none}
.search:focus{border-color:var(--green)}
.item{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.item:first-child{border-top:0}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
.t-red{color:#B42318;background:var(--redbg)}.t-or{color:#B45309;background:var(--orangebg)}.t-gr{color:#047857;background:var(--greenbg)}.t-bl{color:#1D4ED8;background:var(--bluebg)}.t-gy{color:#475569;background:#F1F5F9}
.medal{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:#fff;color:var(--soft);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.more{width:100%;border:1px dashed #CBD5E1;background:transparent;border-radius:12px;padding:11px;font-weight:600;color:var(--soft);cursor:pointer;margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(rgba(238,242,247,0),var(--bg) 35%)}
nav .in{max-width:520px;margin:0 auto;display:flex;gap:4px;background:#fff;border-radius:20px;padding:6px;box-shadow:0 8px 28px rgba(15,23,42,.14);overflow-x:auto;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav button{flex:1 1 0;min-width:0;min-height:52px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:4px 2px;white-space:nowrap}
nav button.on{background:var(--teal);color:#fff}
nav svg{width:22px;height:22px}
.sk{background:linear-gradient(90deg,#fff,#F3F6FA,#fff);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}
.fade{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grow{transform:scaleY(0);transform-origin:bottom;transform-box:fill-box;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.chartbox{overflow-x:auto;scrollbar-width:thin;margin:6px -4px 0;padding:0 4px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="sk" style="height:52px"></div><div class="sk" style="height:150px"></div>
  <div class="sk" style="height:180px"></div><div class="sk" style="height:240px"></div>
</div>
<nav id="nav" class="hidden"><div class="in" id="navin"></div></nav>

<script>
// Ma'lumot manbai: Google Apps Script (Telegram imzosini tekshiradi va Google Sheets'dan hisoblaydi).
// Manzilni bot o'zi beradi (?api=...), shuning uchun Apps Script yangi manzilga ko'chsa sahifani qayta yuklash shart emas.
const API = (() => {
  const a = new URLSearchParams(location.search).get("api") || "";
  return a.startsWith("https://script.google.com/macros/s/") ? a
    : "https://script.google.com/macros/s/AKfycbwzYvqVeXlT8yr7LS5olddyPID1VxpMOBnCCNQYV5ewXdUc8lO2KWO35JTY0_zz-cUe/exec";
})();
const tg = window.Telegram && window.Telegram.WebApp;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("ru-RU");
let D = null, TAB = "umumiy";
const F = { idle: { tur: "all", tuman: "all", q: "", n: 40 }, active: { tuman: "all", q: "", n: 40 }, reyt: { tuman: "all", q: "" } };

if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#EEF2F7"); tg.setBackgroundColor("#EEF2F7"); tg.setBottomBarColor && tg.setBottomBarColor("#EEF2F7"); } catch (e) {} }

// ---------- Ikonkalar
const IC = {
  umumiy: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/>',
  bugun: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M12 14v3l2 1"/>',
  reja: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  idle: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  active: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  reyting: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  men: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
};
const icon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

// ---------- Animatsiyalar
function animatsiya(root) {
  root.querySelectorAll("[data-n]").forEach((el) => {
    const n = Number(el.dataset.n), s = performance.now(), dur = 1200, suf = el.dataset.suf || "";
    const step = (t) => { const k = Math.min(1, (t - s) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(Math.round(n * e)) + suf; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.querySelectorAll("[data-w]").forEach((el) => (el.style.width = el.dataset.w + "%"));
    root.querySelectorAll("[data-dash]").forEach((el) => (el.style.strokeDashoffset = el.dataset.dash));
    root.querySelectorAll(".grow").forEach((el, i) => setTimeout(() => (el.style.transform = "scaleY(1)"), i * 18));
  }));
  root.querySelectorAll(".chartbox").forEach((el) => (el.scrollLeft = el.scrollWidth));
}
const N = (v, suf = "") => `<span data-n="${Number(v) || 0}" data-suf="${suf}">0${suf}</span>`;
const pct = (a, b) => (b ? Math.round(a * 100 / b) : 0);
const medal = [["#FEF3C7", "#B45309"], ["#F1F5F9", "#475569"], ["#FFEDD5", "#C2410C"]];

function halqa(foiz, size = 120, stroke = 12, rang = "#10B981", fon = "#EEF1F6") {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, off = C * (1 - Math.min(100, foiz) / 100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${fon}" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${rang}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" style="stroke-dashoffset:${C.toFixed(1)};transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)"
      data-dash="${off.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
}

// ---------- Sana yordamchilari
function sanaQism() { const [k, o, y] = D.sana.split(".").map(Number); return { k, o, y }; }
const HK = ["Ya", "Du", "Se", "Ch", "Pa", "Ju", "Sh"];
function haftaKuni(d) { const { o, y } = sanaQism(); return new Date(y, o - 1, d).getDay(); }
function qolganIshKuni() { const { k, o, y } = sanaQism(); const oxir = new Date(y, o, 0).getDate(); let n = 0;
  for (let d = k + 1; d <= oxir; d++) if (new Date(y, o - 1, d).getDay() !== 0) n++; return n; }

// ---------- Kunlik grafik: har ustun ustida son, ostida sana va hafta kuni; yakshanbalar ajratilgan
function grafik(kunlik, ortacha, rang = "#10B981") {
  const slot = 30, bw = 18, H = 210, T = 26, B = 46, ph = H - T - B, n = kunlik.length, W = n * slot + 8;
  const max = Math.max(10, ...kunlik), ymax = Math.ceil(max * 1.1);
  const rek = Math.max(...kunlik), y = (v) => T + ph - (v / ymax) * ph;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kunlik sotuvlar grafigi" style="display:block">`;
  s += `<defs><pattern id="chiz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#D1FAE5"/><rect width="3" height="8" fill="${rang}"/></pattern></defs>`;
  kunlik.forEach((v, i) => { if (haftaKuni(i + 1) === 0) s += `<rect x="${i * slot + 4}" y="${T - 6}" width="${slot}" height="${ph + 6}" fill="#F3F5F9" rx="4"/>`; });
  s += `<line x1="0" x2="${W}" y1="${T + ph}" y2="${T + ph}" stroke="#E2E8F0" stroke-width="1.5"/>`;
  kunlik.forEach((v, i) => {
    const d = i + 1, x = i * slot + 4 + (slot - bw) / 2, cx = i * slot + 4 + slot / 2, bugun = d === n, yak = haftaKuni(d) === 0;
    const f = bugun ? "url(#chiz)" : (v === rek && v > 0 ? "#F59E0B" : rang);
    if (v) {
      s += `<rect class="grow" x="${x}" y="${y(v).toFixed(1)}" width="${bw}" height="${(T + ph - y(v)).toFixed(1)}" rx="5" fill="${f}"${bugun ? ` stroke="${rang}" stroke-width="1.5"` : ""}/>`;
      s += `<text x="${cx}" y="${(y(v) - 6).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="${v === rek ? "#B45309" : "#1E293B"}">${v}</text>`;
    } else s += `<text x="${cx}" y="${T + ph - 5}" text-anchor="middle" font-size="11" fill="#CBD5E1">–</text>`;
    s += `<text x="${cx}" y="${T + ph + 18}" text-anchor="middle" font-size="12" font-weight="${bugun ? 800 : 600}" fill="${bugun ? "#0F766E" : "#334155"}">${d}</text>`;
    s += `<text x="${cx}" y="${T + ph + 34}" text-anchor="middle" font-size="10" fill="${yak ? "#E5484D" : "#94A0B4"}">${HK[haftaKuni(d)]}</text>`;
  });
  if (ortacha) s += `<line x1="0" x2="${W}" y1="${y(ortacha).toFixed(1)}" y2="${y(ortacha).toFixed(1)}" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>`;
  return `<div class="chartbox">${s}</svg></div>
    <div class="row xs muted" style="flex-wrap:wrap;gap:12px;margin-top:8px">
      <span><span class="dot" style="background:${rang}"></span>sotuv</span><span><span class="dot" style="background:#F59E0B"></span>rekord</span>
      <span><span class="dot" style="background:#F3F5F9;outline:1px solid #E2E8F0"></span>yakshanba</span>
      ${ortacha ? `<span><span style="display:inline-block;width:14px;border-top:2px dashed #3B82F6;margin-right:6px;vertical-align:3px"></span>o'rtacha ${ortacha}/kun</span>` : ""}</div>`;
}
function haftalar(kunlik) {
  const h = []; let joriy = null;
  kunlik.forEach((v, i) => { const d = i + 1, hk = haftaKuni(d);
    if (!joriy || hk === 1) { joriy = { bosh: d, oxir: d, son: 0 }; h.push(joriy); }
    joriy.oxir = d; joriy.son += v; });
  if (h.length > 1 && h[0].oxir === h[0].bosh) { h[1].bosh = h[0].bosh; h[1].son += h[0].son; h.shift(); }  // oy yakshanbadan boshlansa
  const eng = Math.max(...h.map((x) => x.son));
  return `<div class="grid2" style="margin-top:10px">${h.map((x, i) => {
    const oxirgi = i === h.length - 1, eng1 = x.son === eng && !oxirgi;
    return `<div style="border-radius:12px;padding:9px 11px;font-size:12px;background:${eng1 ? "#FEF3C7" : oxirgi ? "#ECFDF5" : "#F6F8FB"};color:${eng1 ? "#92400E" : oxirgi ? "#047857" : "#475569"}">
      ${x.bosh}–${x.oxir}: <b style="font-size:15px;color:#0F172A">${x.son}</b> ta${eng1 ? " · eng yaxshi" : oxirgi ? " · hozircha" : ""}</div>`; }).join("")}</div>`;
}

// ---------- Umumiy bloklar
function sarlavha() {
  return `<header class="between fade">
    <div class="row" style="gap:10px;min-width:0">
      <div style="width:42px;height:42px;border-radius:13px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px;flex-shrink:0">7</div>
      <div style="min-width:0"><div style="font-weight:800;font-size:17px;white-space:nowrap">7-bog'lama sotuv</div>
      <div class="xs muted" style="white-space:nowrap">${esc(D.oy)} · ${esc(D.sana.slice(0, 5))}${D.sbms ? ` · SBMS ${esc(D.sbms.slice(0, 5))}` : ""}</div></div></div>
    <button class="iconbtn" type="button" onclick="yukla(true)" aria-label="Yangilash"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg></button></header>`;
}
function rejaHero(R) {
  if (!R) return `<section class="card fade small muted">Bu oy uchun reja hali kiritilmagan (botda: 📊 Hisobotlar → 🎯 Oylik reja).</section>`;
  return `<section class="card fade row" style="background:linear-gradient(135deg,#0F766E,#0B5E58);color:#fff;gap:16px">
    <div style="position:relative;width:116px;height:116px;flex-shrink:0">${halqa(R.foiz, 116, 12, "#5EEAD4", "rgba(255,255,255,.18)")}
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-weight:800;font-size:28px;line-height:1">${N(R.foiz, "%")}</div><div class="xs" style="color:#CCFBF1;margin-top:3px">bajarildi</div></div></div>
    <div style="min-width:0;display:flex;flex-direction:column;gap:6px">
      <div class="lbl" style="color:#A7F3D0">Oylik reja</div>
      <div style="font-weight:800;font-size:26px;line-height:1">${N(R.bajarildi)} <span style="font-size:16px;color:#99F6E4">/ ${fmt(R.jami)}</span></div>
      <div class="xs" style="color:#FDE68A"><span class="dot" style="background:#FCD34D"></span>puli bor idle: ${R.puliBor}</div>
      <div class="small" style="color:#CCFBF1">${R.qolgan > 0 ? `Qolgan <b style="color:#fff">${fmt(R.qolgan)}</b> · ${R.qolganKun} kun · kuniga ~${R.kuniga}` : "<b>Reja bajarildi! 🎉</b>"}</div></div></section>`;
}
function kpi(lbl, v, sub, rang = "") { return `<div class="card kpi"><div class="lbl">${lbl}</div><div class="num" style="margin-top:6px;${rang ? "color:" + rang : ""}">${N(v)}</div><div class="xs muted" style="margin-top:4px">${sub}</div></div>`; }
function yettiKun(k) { const s = k.slice(Math.max(0, k.length - 8), k.length - 1), o = k.slice(Math.max(0, k.length - 15), Math.max(0, k.length - 8));
  const a = s.reduce((x, y) => x + y, 0), b = o.reduce((x, y) => x + y, 0); return { a, b, f: b ? Math.round((a - b) * 100 / b) : 0 }; }

function sahifaUmumiy() {
  const U = D.umumiy, R = D.reja, y7 = yettiKun(U.kunlik);
  let h = sarlavha() + rejaHero(R);
  h += `<section class="grid2 fade">
    ${kpi("Bugun sotuv", U.bugun, `kecha: ${U.kecha}`)}
    ${kpi("Bugun ulandi", U.bugunUlangan, "active bo'ldi", "var(--green2)")}
    ${kpi("Oy bo'yicha sotuv", U.jami, "shu oy shartnomalari")}
    ${kpi("Active", U.active, U.oldingiActive ? `shundan oldingi oy: ${U.oldingiActive}` : "ulangan", "var(--green2)")}
    ${kpi("Idle", U.idle, `<b style="color:var(--red)">${U.puliYoq}</b> puli yo'q · <b style="color:var(--orange)">${U.idle - U.puliYoq}</b> puli bor`, "var(--orange)")}
    ${kpi("Oxirgi 7 kun", y7.a, y7.b ? `<b style="color:${y7.f >= 0 ? "var(--green2)" : "var(--red)"}">${y7.f >= 0 ? "▲" : "▼"} ${Math.abs(y7.f)}%</b> oldingi 7 kundan` : "sotuv")}</section>`;
  h += `<section class="card fade"><div class="between"><div><div class="ttl">Kunlik sotuvlar</div><div class="xs muted">Har bir ustun — o'sha kuni kiritilgan sotuvlar soni</div></div>
    ${U.rekord.son ? `<span class="tag t-or">rekord ${U.rekord.son} · ${U.rekord.kun}-kun</span>` : ""}</div>
    ${grafik(U.kunlik, U.ortacha)}${haftalar(U.kunlik)}</section>`;
  if (R && R.tumanlar.length) {
    h += `<section class="card fade" style="display:flex;flex-direction:column;gap:14px"><div class="ttl">Tumanlar bo'yicha reja</div>
      ${R.tumanlar.map((t) => { const tm = D.tumanlar.find((x) => x.nom === t.nom) || {};
        return `<div><div class="between small"><b>${esc(t.nom)}</b><span>${N(t.son)} / ${t.reja} · <b style="color:${t.foiz >= 80 ? "var(--green2)" : "var(--orange)"}">${N(t.foiz, "%")}</b></span></div>
        <div class="track" style="margin-top:7px"><div class="fill" style="background:${t.foiz >= 80 ? "var(--green)" : "var(--orange2)"}" data-w="${Math.min(100, t.son * 100 / t.reja).toFixed(1)}"></div></div>
        <div class="xs muted" style="margin-top:6px">sotuv ${tm.jami ?? "–"} · <span style="color:var(--green2)">active ${tm.active ?? "–"}</span> · <span style="color:var(--orange)">idle ${tm.idle ?? "–"}</span> · puli bor idle ${t.puliBor}</div></div>`; }).join("")}</section>`;
  }
  h += `<section class="card fade"><div class="between" style="margin-bottom:4px"><div class="ttl">TOP 5 sotuvchi</div><span class="xs muted">shu oy</span></div>
    ${D.top.map((o, i) => `<div class="row" style="padding:9px 0;${i ? "border-top:1px solid var(--line)" : ""}">
      <div class="medal" style="background:${(medal[i] || ["#F8FAFC"])[0]};color:${(medal[i] || ["", "#64748B"])[1]}">${i + 1}</div>
      <div style="flex:1" class="ellip"><div style="font-weight:700;font-size:15px" class="ellip">${esc(o.nom)}</div><div class="xs muted">${esc(o.tuman)}</div></div>
      <div style="font-weight:800;font-size:20px">${N(o.son)}</div></div>`).join("")}</section>`;
  return h;
}

// ---------- Mening sotuvlarim
function sahifaMen() {
  const M = D.men;
  if (!M) return sarlavha() + `<section class="card fade"><div class="ttl">Mening sotuvlarim</div><p class="small muted" style="margin:8px 0 0">Siz admin sifatida kirdingiz — shaxsiy sotuvlar yo'q. Botda xodim sifatida ro'yxatdan o'tsangiz, bu yerda o'z sotuvlaringiz chiqadi.</p></section>`;

  let h = sarlavha() + `<section class="card fade row" style="gap:12px">
    <div style="width:50px;height:50px;border-radius:16px;background:var(--greenbg);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0">${esc(bosh)}</div>
    <div style="flex:1" class="ellip"><div style="font-weight:800;font-size:18px" class="ellip">${esc(M.qisqa)}</div><div class="xs muted">${esc(M.tuman)} · ${esc(D.oy)}</div></div>
    ${M.orin ? `<div style="text-align:center;background:#FEF3C7;border-radius:14px;padding:8px 12px"><div style="font-weight:800;font-size:20px;color:#B45309;line-height:1">${N(M.orin)}</div><div style="font-size:10px;color:#92400E;margin-top:2px">o'rin / ${M.operatorlar}</div></div>` : ""}</section>`;
  h += `<section class="grid3 fade">
    <div class="card kpi"><div class="lbl">Bugun</div><div class="num" style="margin-top:6px">${N(M.bugun)}</div><div class="xs muted">kecha ${M.kecha}</div></div>
    <div class="card kpi"><div class="lbl">Shu oy</div><div class="num" style="margin-top:6px">${N(M.oy)}</div><div class="xs muted">sotuv</div></div>
    <div class="card kpi"><div class="lbl">Seriya</div><div class="num" style="margin-top:6px">${N(M.seriya)}</div><div class="xs muted">kun ketma-ket</div></div></section>`;
  h += `<section class="grid3 fade">

    <div class="card kpi" style="background:var(--orangebg)"><div class="lbl" style="color:#B45309">Idle</div><div class="num" style="margin-top:6px;color:var(--orange)">${N(M.idle)}</div></div>
    <div class="card kpi" style="background:var(--redbg)"><div class="lbl" style="color:#B42318">Puli yo'q</div><div class="num" style="margin-top:6px;color:var(--red)">${N(M.puliYoq)}</div></div></section>`;
  h += `<section class="card fade"><div class="ttl">Kunlik sotuvlarim</div>${grafik(M.kunlik, 0, "#3B82F6")}</section>`;
  if (T) {
    const men = Math.min(100, M.hissa * 100 / T.reja), boshqa = Math.max(0, Math.min(100, T.son * 100 / T.reja) - men);
    h += `<section class="card fade"><div class="ttl">${esc(M.tuman)} rejasi</div>
      <div class="row" style="align-items:baseline;gap:8px;margin-top:8px"><span class="num">${N(T.son)}</span><span class="muted">/ ${T.reja}</span><span style="margin-left:auto;font-weight:800;font-size:20px;color:var(--green2)">${N(T.foiz, "%")}</span></div>
      <div class="track" style="height:14px;margin-top:10px"><div class="fill" style="background:var(--blue);border-radius:999px 0 0 999px" data-w="${men.toFixed(1)}"></div><div class="fill" style="background:var(--green);border-radius:0 999px 999px 0" data-w="${boshqa.toFixed(1)}"></div></div>
      <div class="row small" style="gap:14px;margin-top:10px;flex-wrap:wrap"><span><span class="dot" style="background:var(--blue)"></span>Mening hissam: <b>${M.hissa}</b> ta (${pct(M.hissa, T.reja)}%)</span><span><span class="dot" style="background:var(--green)"></span>Jamoa</span></div>
      <div class="small muted" style="margin-top:8px">${T.qolgan > 0 ? `Rejagacha ${T.qolgan} ta qoldi${T.kuniga ? ` · kuniga ~${T.kuniga}` : ""}` : "Tuman rejasi bajarildi! 🎉"}</div></section>`;
  }
  h += `<section class="card fade"><div class="between"><div class="ttl">Idle abonentlarim</div><span class="tag t-or">${M.idlelar.length} ta</span></div>

}
function abonentQator(a) {

    ${A.bugungi.length ? A.bugungi.map((s) => `<div class="item"><div class="between"><b class="small ellip">${esc(s.op)}</b>${s.active ? '<span class="tag t-gr">active</span>' : '<span class="tag t-gy">idle</span>'}</div>

// ---------- Admin: Reja
function sahifaReja() {
  const R = D.reja, U = D.umumiy;
  if (!R) return sarlavha() + rejaHero(null);
  const ish = qolganIshKuni(), surat = U.ortacha || 0, prog = R.bajarildi + Math.round(surat * ish * (R.bajarildi / Math.max(1, U.jami)));

  let h = sarlavha() + `<section class="card fade" style="text-align:center">
    <div class="lbl">Oylik reja</div>

    <div class="track" style="height:12px;margin-top:10px;position:relative"><div class="fill" style="background:${progF >= 100 ? "var(--green)" : "var(--orange2)"}" data-w="${Math.min(100, progF)}"></div></div>
    <div class="xs muted" style="margin-top:8px">Rejaga shu oy shartnomalari kiradi: active + 💰 puli bor idle (${R.puliBor} ta).${R.oldingiOy ? ` Oldingi oy shartnomalari (${R.oldingiOy} ta) kirmaydi.` : ""}${Object.keys(R.tashqari || {}).length ? " Rejadan tashqari tariflar: " + Object.entries(R.tashqari).map(([k, v]) => esc(k) + " " + v).join(", ") + "." : ""}</div></section>`;
  h += R.tumanlar.map((t) => { const q = Math.max(0, t.reja - t.son), rang = t.foiz >= 80 ? "#10B981" : "#F59E0B";
    return `<section class="card fade row" style="gap:14px">
      <div style="position:relative;width:84px;height:84px;flex-shrink:0">${halqa(t.foiz, 84, 9, rang)}
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px">${N(t.foiz, "%")}</div></div>
      <div style="flex:1;min-width:0"><div class="between"><b style="font-size:16px">${esc(t.nom)}</b><span class="small"><b>${fmt(t.son)}</b> / ${fmt(t.reja)}</span></div>

// ---------- Admin: ro'yxatlar (qidiruv va filtrlar)
function tumanChips(f, key) {
  const tm = ["all", ...Object.keys(D.adm.tumanKunlik)];
  return `<div class="chips">${tm.map((t) => `<button type="button" class="chip ${F[key].tuman === t ? "on" : ""}" onclick="F.${key}.tuman='${esc(t)}';F.${key}.n=40;chiz()">${t === "all" ? "Barcha tumanlar" : esc(t)}</button>`).join("")}</div>`;
}
function qidiruv(key, ph) {
  return `<input class="search" type="search" placeholder="${ph}" value="${esc(F[key].q)}" oninput="F.${key}.q=this.value;F.${key}.n=40;royxatChiz('${key}')" aria-label="${ph}">`;
}
const mos = (q, ...s) => !q || s.join(" ").toLowerCase().includes(q.toLowerCase());

function sahifaIdle() {
  // tepadagi raqamlar tanlangan tuman bo'yicha
  const L = D.adm.idlelar.filter((a) => F.idle.tuman === "all" || a.tuman === F.idle.tuman), py = L.filter((a) => a.pulisiz).length;
  return sarlavha() + `<section class="grid3 fade">
    <div class="card kpi"><div class="lbl ellip">Idle${F.idle.tuman === "all" ? "" : " · " + esc(F.idle.tuman)}</div><div class="num" style="margin-top:6px;color:var(--orange)">${N(L.length)}</div></div>
    <div class="card kpi"><div class="lbl">Puli yo'q</div><div class="num" style="margin-top:6px;color:var(--red)">${N(py)}</div></div>
    <div class="card kpi"><div class="lbl">Puli bor</div><div class="num" style="margin-top:6px;color:var(--green2)">${N(L.length - py)}</div></div></section>
    <section class="card fade" style="display:flex;flex-direction:column;gap:10px">
      <div class="chips">${[["all", "Hammasi"], ["yoq", "Puli yo'q"], ["bor", "Puli bor"]].map(([k, t]) => `<button type="button" class="chip ${F.idle.tur === k ? "on" : ""}" onclick="F.idle.tur='${k}';F.idle.n=40;chiz()">${t}</button>`).join("")}</div>
      ${tumanChips(F.idle, "idle")}${qidiruv("idle", "Login, abonent, manzil yoki operator...")}
      <div id="royxat-idle"></div></section>`;
}
function sahifaActive() {
  const L = D.adm.activelar;
  const tm = Object.keys(D.adm.tumanKunlik);
  return sarlavha() + `<section class="grid${tm.length === 3 ? 3 : 2} fade">${tm.map((t) => `<div class="card kpi" style="${F.active.tuman === t ? "outline:2px solid var(--green);" : F.active.tuman !== "all" ? "opacity:.55;" : ""}"><div class="lbl ellip">${esc(t)}</div><div class="num" style="margin-top:6px;color:var(--green2)">${N(L.filter((a) => a.tuman === t).length)}</div><div class="xs muted">active</div></div>`).join("")}</section>
    <section class="card fade" style="display:flex;flex-direction:column;gap:10px">
      <div class="between"><div class="ttl">Active abonentlar</div><span class="tag t-gr">${fmt(L.length)} ta</span></div>
      ${tumanChips(F.active, "active")}${qidiruv("active", "Login, abonent yoki operator...")}
      <div id="royxat-active"></div></section>`;
}
function sahifaReyting() {
  return sarlavha() + `<section class="card fade" style="display:flex;flex-direction:column;gap:10px">
    <div class="between"><div class="ttl">Sotuvchilar reytingi</div><span class="tag t-gy">${D.adm.reyting.length} ta</span></div>
    ${tumanChips(F.reyt, "reyt")}${qidiruv("reyt", "Sotuvchi ismi...")}<div id="royxat-reyt"></div></section>`;
}
function royxatChiz(key) {
  const box = $("royxat-" + key); if (!box) return;
  const f = F[key]; let h = "";
  if (key === "idle") {
    const L = D.adm.idlelar.filter((a) => (f.tur === "all" || (f.tur === "yoq") === a.pulisiz) && (f.tuman === "all" || a.tuman === f.tuman) && mos(f.q, a.login, a.abonent, a.manzil, a.op));
    h = `<div class="xs muted">${L.length} ta topildi</div>` + L.slice(0, f.n).map(abonentQator).join("") + (L.length > f.n ? `<button class="more" type="button" onclick="F.idle.n+=40;royxatChiz('idle')">Yana ko'rsatish (${L.length - f.n})</button>` : "");
  } else if (key === "active") {
    const L = D.adm.activelar.filter((a) => (f.tuman === "all" || a.tuman === f.tuman) && mos(f.q, a.login, a.abonent, a.op));
    h = `<div class="xs muted">${L.length} ta topildi</div>` + L.slice(0, f.n).map((a) => `<div class="item"><div class="between"><b class="small">${esc(a.login || "—")}</b>${a.oldingi ? '<span class="tag t-bl">oldingi oy</span>' : ""}</div>
      <div class="small" style="color:var(--soft)">${esc(a.abonent || "")}</div><div class="xs muted">${esc(a.op)} · ${esc(a.tuman)} · shartnoma ${esc(a.sana)}${a.ulangan ? " · ulangan " + esc(a.ulangan) : ""}</div></div>`).join("")
      + (L.length > f.n ? `<button class="more" type="button" onclick="F.active.n+=40;royxatChiz('active')">Yana ko'rsatish (${L.length - f.n})</button>` : "");
  } else {
    const all = D.adm.reyting, L = all.filter((o) => (f.tuman === "all" || o.tuman === f.tuman) && mos(f.q, o.nom)), max = Math.max(1, ...all.map((o) => o.son));
    h = L.map((o) => { const i = all.indexOf(o);
      return `<div class="row" style="padding:10px 0;border-top:1px solid var(--line)">
        <div class="medal" style="background:${(medal[i] || ["#F8FAFC"])[0]};color:${(medal[i] || ["", "#64748B"])[1]};width:32px;height:32px;font-size:13px">${i + 1}</div>
        <div style="flex:1;min-width:0"><div class="row" style="gap:6px"><b class="small ellip">${esc(o.nom)}</b>${o.bugun ? `<span class="tag t-gr">+${o.bugun} bugun</span>` : ""}</div>
          <div class="track" style="height:6px;margin-top:6px"><div class="fill" style="background:var(--green)" data-w="${(o.son * 100 / max).toFixed(1)}"></div></div>
          <div class="xs muted" style="margin-top:5px">${esc(o.tuman)} · <span style="color:var(--green2)">active ${o.active}</span> · <span style="color:var(--orange)">idle ${o.idle}</span>${o.puliYoq ? ` · <span style="color:var(--red)">puli yo'q ${o.puliYoq}</span>` : ""}</div></div>
        <div style="font-weight:800;font-size:19px;width:36px;text-align:right">${o.son}</div></div>`; }).join("") || `<p class="small muted">Topilmadi.</p>`;
  }
  box.innerHTML = h;
  requestAnimationFrame(() => requestAnimationFrame(() => box.querySelectorAll("[data-w]").forEach((el) => (el.style.width = el.dataset.w + "%"))));
}

// ---------- Navigatsiya
function tablar() {
  const t = [["umumiy", "Umumiy"]];
  if (D.admin && D.adm) t.push(["bugun", "Bugun"], ["reja", "Reja"], ["idle", "Idle"], ["active", "Active"], ["reyting", "Reyting"]);
  t.push(["men", D.admin && D.adm ? "Men" : "Mening sotuvlarim"]);
  return t;
}
function chiz() {
  const sah = { umumiy: sahifaUmumiy, men: sahifaMen, bugun: sahifaBugun, reja: sahifaReja, idle: sahifaIdle, active: sahifaActive, reyting: sahifaReyting };
  if (!tablar().some(([k]) => k === TAB)) TAB = "umumiy";
  const app = $("app");
  app.innerHTML = sah[TAB]();
  ["idle", "active", "reyt"].forEach(royxatChiz);
  $("navin").innerHTML = tablar().map(([k, t]) => `<button type="button" class="${TAB === k ? "on" : ""}" onclick="tabga('${k}')" aria-label="${t}">${icon(k)}<span>${t}</span></button>`).join("");
  $("nav").classList.remove("hidden");
  animatsiya(app);
}
function tabga(k) { TAB = k; window.scrollTo(0, 0); chiz(); if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }

function xato(matn) {
  $("nav").classList.add("hidden");
  $("app").innerHTML = `<section class="card fade" style="margin-top:28vh;text-align:center">
    <div class="ttl" style="margin-bottom:8px">7-bog'lama sotuv</div><div class="small muted">${esc(matn)}</div>
    ${tg && tg.initData ? `<button class="chip on" style="margin-top:14px" type="button" onclick="yukla(true)">Qayta urinish</button>` : ""}</section>`;
}
async function yukla(qayta) {
  if (qayta && D) $("app").style.opacity = ".5";
  const demo = new URLSearchParams(location.search).has("demo");
  if (!demo && !(tg && tg.initData)) return xato("Ilovani Telegram'dagi botning «📱 Ilova» tugmasi orqali oching.");
  try {
    const res = demo ? demoMalumot() : await (await fetch(API, { method: "POST", body: JSON.stringify({ action: "app", initData: tg.initData }) })).json();
    if (!res.ok) return xato(res.error || "Ma'lumotni olib bo'lmadi.");
    D = res; $("app").style.opacity = "1"; chiz();
    if (tg && tg.HapticFeedback && qayta) tg.HapticFeedback.notificationOccurred("success");
  } catch (e) { xato("Internet yoki server bilan aloqa yo'q. Birozdan so'ng qayta urinib ko'ring."); }
}

// ?demo — brauzerda ko'rish uchun o'ylab topilgan namunaviy ma'lumot (haqiqiy emas)
function demoMalumot() {
  const k = [0, 9, 18, 15, 14, 20, 8, 0, 17, 16, 17, 20, 15, 8, 3, 21, 17, 20, 20, 24, 13, 0, 25, 24, 28, 21, 12];
  const tm = ["Tuman A", "Tuman B", "Tuman C"], ism = (i) => "Operator " + (i + 1);
